<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <title>Namepad</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f7f7f5;
        --paper: #fff;
        --ink: #20201f;
        --muted: #777773;
        --line: #e8e8e4;
        --accent: #bd654b;
        --hover: #eeeee9;
        --gutter: #999994;
        --shadow: 0 18px 60px rgb(34 34 29 / 7%);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --page: #191a19;
        --paper: #222321;
        --ink: #efefeb;
        --muted: #a4a49d;
        --line: #373834;
        --accent: #e18b6e;
        --hover: #30312e;
        --gutter: #85867f;
        --shadow: 0 18px 60px rgb(0 0 0 / 18%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: background-color 160ms ease, color 160ms ease;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .topbar {
        position: relative;
        z-index: 3;
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 14px clamp(18px, 4vw, 56px);
      }

      .stats {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.015em;
        opacity: 0.76;
        white-space: nowrap;
      }

      .stats span + span::before {
        content: "·";
        margin: 0 9px;
        color: var(--gutter);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 6px;
      }

      .toolbar button {
        min-height: 36px;
        padding: 0 11px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        transition: background-color 120ms ease, color 120ms ease;
      }

      .toolbar button:hover,
      .toolbar button:focus-visible {
        background: var(--hover);
        color: var(--ink);
        outline: none;
      }

      .toolbar .theme-toggle {
        margin-left: 5px;
        padding-inline: 12px;
        border: 1px solid var(--line);
      }

      .sort-control {
        position: relative;
      }

      .sort-menu,
      .tools-menu {
        position: absolute;
        z-index: 4;
        top: calc(100% + 8px);
        right: 0;
        width: min(300px, calc(100vw - 24px));
        max-height: min(70vh, 520px);
        overflow-y: auto;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .sort-menu[hidden] {
        display: none;
      }

      .tools-control {
        position: relative;
      }

      .tools-menu[hidden] {
        display: none;
      }

      .toolbar .sort-menu button {
        width: 100%;
        text-align: left;
      }

      .tools-menu > button {
        display: block;
        width: 100%;
        text-align: left;
      }

      .tools-menu button {
        min-height: 34px;
      }

      .tools-menu button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .history-actions,
      .search-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .search-field {
        display: grid;
        gap: 4px;
        padding: 8px 10px 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .search-field input {
        width: 100%;
        min-height: 34px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--page);
        color: var(--ink);
        font: inherit;
      }

      .find-count {
        min-height: 18px;
        padding: 2px 10px 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .stats-panel {
        margin: 4px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-line;
      }

      .stats-panel[hidden] {
        display: none;
      }

      main {
        min-height: calc(100vh - 72px);
        display: grid;
        place-items: start center;
        padding: clamp(8px, 3vh, 30px) 20px 56px;
      }

      .editor-card {
        width: min(100%, 900px);
        height: min(76vh, 760px);
        min-height: 360px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .editor-wrap {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .editor[hidden],
      .line-numbers[hidden],
      .reorder-list[hidden] {
        display: none;
      }

      .reorder-list {
        position: absolute;
        z-index: 2;
        inset: 0;
        overflow: auto;
        padding: 16px 20px;
        background: var(--paper);
      }

      .reorder-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 4px 6px;
        border-bottom: 1px solid var(--line);
        cursor: grab;
      }

      .reorder-row:active {
        cursor: grabbing;
      }

      .reorder-name {
        flex: 1;
        overflow-wrap: anywhere;
      }

      .reorder-row button {
        min-width: 34px;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--muted);
        cursor: pointer;
      }

      .reorder-row button:hover,
      .reorder-row button:focus-visible {
        background: var(--hover);
        color: var(--ink);
      }

      .reorder-row button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .line-numbers {
        position: absolute;
        z-index: 1;
        top: 0;
        left: 0;
        min-width: 64px;
        padding: 25px 14px 80px 0;
        color: var(--gutter);
        text-align: right;
        pointer-events: none;
        user-select: none;
        will-change: transform;
      }

      .line-number {
        height: 2.8rem;
        font-size: 13px;
        line-height: 2.8rem;
      }

      .editor {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 25px 32px 80px 82px;
        overflow: auto;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        caret-color: var(--accent);
        font: 400 17px/2.8rem ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.005em;
        tab-size: 2;
        white-space: pre;
      }

      .editor::placeholder {
        color: var(--muted);
        opacity: 0.58;
      }

      .notice {
        position: fixed;
        right: 20px;
        bottom: 18px;
        max-width: min(420px, calc(100vw - 40px));
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--muted);
        box-shadow: var(--shadow);
        font-size: 13px;
      }

      .notice:empty {
        display: none;
      }

      .file-input {
        display: none;
      }

      @media (max-width: 560px) {
        .topbar {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          align-items: start;
          gap: 8px;
          padding: 10px 12px 8px;
        }

        .stats {
          justify-self: center;
          font-size: 11px;
        }

        .stats span + span::before {
          margin-inline: 5px;
        }

        .toolbar {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 4px;
        }

        .toolbar button {
          min-height: 44px;
          padding-inline: 4px;
          font-size: 11px;
        }

        .toolbar > button,
        .toolbar > .sort-control,
        .toolbar > .tools-control {
          width: 100%;
          min-width: 0;
        }

        .sort-control > button,
        .tools-control > button {
          width: 100%;
        }

        .sort-menu,
        .tools-menu {
          position: fixed;
          top: 84px;
          right: 12px;
          left: 12px;
          width: auto;
          max-height: calc(100vh - 96px);
          max-height: calc(100dvh - 96px);
        }

        .toolbar .theme-toggle {
          margin-left: 0;
          padding-inline: 4px;
        }

        main {
          min-height: calc(100vh - 132px);
          min-height: calc(100dvh - 132px);
          padding: 8px 10px max(16px, env(safe-area-inset-bottom));
        }

        .editor-card {
          height: calc(100vh - 180px);
          height: calc(100dvh - 180px);
          min-height: 280px;
          border-radius: 9px;
        }

        .editor {
          padding-right: 18px;
          padding-left: 66px;
          font-size: 15px;
        }

        .line-numbers {
          min-width: 52px;
          padding-right: 10px;
        }

        .reorder-list {
          padding: 10px 8px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="stats" aria-live="polite" aria-label="List statistics">
        <span id="character-count">0 characters</span>
        <span id="word-count">0 words</span>
        <span id="name-count">0 names</span>
      </div>
      <nav class="toolbar" aria-label="List actions">
        <div id="sort-control" class="sort-control">
          <button id="sort-button" type="button" aria-expanded="false" aria-controls="sort-menu">Sort</button>
          <div id="sort-menu" class="sort-menu" role="group" aria-label="Sort names" hidden>
            <button type="button" data-sort="first-alpha">First name A–Z</button>
            <button type="button" data-sort="last-alpha">Last name A–Z</button>
            <button type="button" data-sort="full-alpha">Full name A–Z</button>
            <button type="button" data-sort="first-length-asc">First name length (shortest first)</button>
            <button type="button" data-sort="last-length-asc">Last name length (shortest first)</button>
            <button type="button" data-sort="full-length-asc">Full name length (shortest first)</button>
            <button type="button" data-sort="first-length-desc">First name length (longest first)</button>
            <button type="button" data-sort="last-length-desc">Last name length (longest first)</button>
            <button type="button" data-sort="full-length-desc">Full name length (longest first)</button>
            <button type="button" data-sort="reverse">Reverse current order</button>
          </div>
        </div>
        <button id="cleanup-button" type="button">Clean up</button>
        <div id="tools-control" class="tools-control">
          <button id="tools-button" type="button" aria-expanded="false" aria-controls="tools-menu">Tools</button>
          <div id="tools-menu" class="tools-menu" role="group" aria-label="Name list tools" hidden>
            <div class="history-actions">
              <button id="undo-button" type="button" data-action="undo" disabled>Undo</button>
              <button id="redo-button" type="button" data-action="redo" disabled>Redo</button>
            </div>
            <label class="search-field" for="search-input">
              Find a name or text
              <input id="search-input" type="search" autocomplete="off">
            </label>
            <div class="search-actions">
              <button type="button" data-action="find">Find next</button>
              <span id="find-count" class="find-count" aria-live="polite">Type to search</span>
            </div>
            <button type="button" data-action="pick">Pick a random name</button>
            <button id="stats-button" type="button" data-action="stats" aria-expanded="false" aria-controls="stats-panel">Name statistics</button>
            <div id="stats-panel" class="stats-panel" aria-live="polite" hidden></div>
            <button id="reorder-button" type="button" data-action="reorder" aria-pressed="false">Reorder names</button>
          </div>
        </div>
        <button id="download-button" type="button">Download</button>
        <button id="backup-button" type="button">Backup</button>
        <button id="restore-button" type="button">Restore</button>
        <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
        <input id="backup-file" class="file-input" type="file" accept="application/json,.json">
      </nav>
    </header>
    <main>
      <section class="editor-card" aria-label="Name list">
        <div class="editor-wrap">
          <div id="line-numbers" class="line-numbers" aria-hidden="true"></div>
          <textarea
            id="editor"
            class="editor"
            aria-label="Names, one per line"
            placeholder="Type a name and press Enter"
            autocomplete="off"
            autocapitalize="words"
            autocorrect="off"
            spellcheck="false"
            wrap="off"
            autofocus
          ></textarea>
          <div id="reorder-list" class="reorder-list" role="list" aria-label="Reorder names" hidden></div>
        </div>
      </section>
    </main>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <script>
      (() => {
        const editor = document.querySelector("#editor");
        const lineNumbers = document.querySelector("#line-numbers");
        const characterCount = document.querySelector("#character-count");
        const wordCount = document.querySelector("#word-count");
        const nameCount = document.querySelector("#name-count");
        const themeToggle = document.querySelector("#theme-toggle");
        const sortControl = document.querySelector("#sort-control");
        const sortButton = document.querySelector("#sort-button");
        const sortMenu = document.querySelector("#sort-menu");
        const toolsControl = document.querySelector("#tools-control");
        const toolsButton = document.querySelector("#tools-button");
        const toolsMenu = document.querySelector("#tools-menu");
        const undoButton = document.querySelector("#undo-button");
        const redoButton = document.querySelector("#redo-button");
        const searchInput = document.querySelector("#search-input");
        const findCount = document.querySelector("#find-count");
        const statsButton = document.querySelector("#stats-button");
        const statsPanel = document.querySelector("#stats-panel");
        const reorderButton = document.querySelector("#reorder-button");
        const reorderList = document.querySelector("#reorder-list");
        const notice = document.querySelector("#notice");
        const backupFile = document.querySelector("#backup-file");
        const contentKey = "namepad-content";
        const themeKey = "namepad-theme";
        const nameCollator = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });
        const maxHistoryEntries = 100;
        const sortLabels = {
          "first-alpha": "first name alphabetically",
          "last-alpha": "last name alphabetically",
          "full-alpha": "full name alphabetically",
          "first-length-asc": "first name length, shortest first",
          "last-length-asc": "last name length, shortest first",
          "full-length-asc": "full name length, shortest first",
          "first-length-desc": "first name length, longest first",
          "last-length-desc": "last name length, longest first",
          "full-length-desc": "full name length, longest first",
          reverse: "reverse order"
        };
        let history = [];
        let historyIndex = -1;
        let isReordering = false;
        let noticeTimer;

        function showNotice(message) {
          notice.textContent = message;
          window.clearTimeout(noticeTimer);
          noticeTimer = window.setTimeout(() => {
            notice.textContent = "";
          }, 4000);
        }

        function capitalizeWords(text) {
          return text.replace(/(^|[\s'-])(\p{L})/gu, (match, separator, letter) =>
            separator + letter.toLocaleUpperCase()
          );
        }

        function updateLineNumbers(count) {
          lineNumbers.replaceChildren();
          const fragment = document.createDocumentFragment();
          for (let number = 1; number <= count; number += 1) {
            const line = document.createElement("div");
            line.className = "line-number";
            line.textContent = String(number);
            fragment.append(line);
          }
          lineNumbers.append(fragment);
          lineNumbers.style.transform = `translateY(${-editor.scrollTop}px)`;
        }

        function updateStats() {
          const value = editor.value;
          const lines = value.split("\n");
          const characters = Array.from(value.replace(/\n/g, "")).length;
          const words = value.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || [];
          const names = lines.filter((line) => line.trim().length > 0).length;

          characterCount.textContent = `${characters} ${characters === 1 ? "character" : "characters"}`;
          wordCount.textContent = `${words.length} ${words.length === 1 ? "word" : "words"}`;
          nameCount.textContent = `${names} ${names === 1 ? "name" : "names"}`;
          updateLineNumbers(lines.length);
          if (!statsPanel.hidden) updateNameStatistics();
        }

        function getNameParts(line) {
          const words = line.trim().split(/\s+/);
          return {
            first: words[0] || "",
            last: words[words.length - 1] || "",
            full: words.join(" ")
          };
        }

        function getDuplicateKey(line) {
          const { first, last } = getNameParts(line);
          return `${first.toLocaleLowerCase()}\u0000${last.toLocaleLowerCase()}`;
        }

        function updateNameStatistics() {
          const names = editor.value.split("\n").filter((line) => line.trim().length > 0);
          const uniqueKeys = new Set(names.map(getDuplicateKey));
          const duplicateCount = names.length - uniqueKeys.size;
          const lengths = names.map((name) => Array.from(name.trim()).length);
          let shortestLength = lengths[0] || 0;
          let longestLength = shortestLength;
          for (const length of lengths) {
            shortestLength = Math.min(shortestLength, length);
            longestLength = Math.max(longestLength, length);
          }
          const initials = new Map();

          for (const name of names) {
            const initial = Array.from(getNameParts(name).first)[0]?.toLocaleUpperCase();
            if (initial) initials.set(initial, (initials.get(initial) || 0) + 1);
          }

          const topInitials = [...initials.entries()]
            .sort((left, right) => right[1] - left[1] || nameCollator.compare(left[0], right[0]))
            .slice(0, 3)
            .map(([initial, count]) => `${initial}: ${count}`)
            .join(", ") || "None";
          const shortestNames = names.filter((name, index) => lengths[index] === shortestLength).slice(0, 3);
          const longestNames = names.filter((name, index) => lengths[index] === longestLength).slice(0, 3);

          statsPanel.textContent = [
            `Names: ${names.length}`,
            `Unique first/last-name pairs: ${uniqueKeys.size}`,
            `Duplicate entries: ${duplicateCount}`,
            `Shortest (${shortestLength} characters): ${shortestNames.join(", ") || "None"}`,
            `Longest (${longestLength} characters): ${longestNames.join(", ") || "None"}`,
            `Most common first initials: ${topInitials}`
          ].join("\n");
        }

        function updateHistoryButtons() {
          undoButton.disabled = historyIndex <= 0;
          redoButton.disabled = historyIndex < 0 || historyIndex >= history.length - 1;
        }

        function recordHistory() {
          if (historyIndex >= 0 && history[historyIndex] === editor.value) return;

          history = history.slice(0, historyIndex + 1);
          history.push(editor.value);
          if (history.length > maxHistoryEntries) history.shift();
          historyIndex = history.length - 1;
          updateHistoryButtons();
        }

        function applyHistory(index) {
          if (index < 0 || index >= history.length || index === historyIndex) return;

          historyIndex = index;
          editor.value = history[historyIndex];
          updateStats();
          saveContent();
          updateFindCount();
          if (isReordering) renderReorderList();
          updateHistoryButtons();
        }

        function setEditorContent(value) {
          editor.value = value;
          updateStats();
          saveContent();
          recordHistory();
          updateFindCount();
          updateFindCount();
          if (isReordering) renderReorderList();
        }

        function setSortMenuOpen(open) {
          sortMenu.hidden = !open;
          sortButton.setAttribute("aria-expanded", String(open));
        }

        function setToolsMenuOpen(open) {
          toolsMenu.hidden = !open;
          toolsButton.setAttribute("aria-expanded", String(open));
          if (!open) {
            statsPanel.hidden = true;
            statsButton.setAttribute("aria-expanded", "false");
          }
        }

        function sortNames(sortMode) {
          const lines = editor.value.split("\n");
          const names = lines.filter((line) => line.trim().length > 0);
          const blankLines = lines.length - names.length;

          if (names.length === 0) {
            showNotice("Add names to your list before sorting.");
            return;
          }

          if (sortMode === "reverse") {
            names.reverse();
          } else {
            const sortBy = sortMode.startsWith("first-")
              ? "first"
              : sortMode.startsWith("last-")
                ? "last"
                : "full";
            const sortByLength = sortMode.includes("-length-");
            const direction = sortMode.endsWith("-desc") ? -1 : 1;
            const getValue = (line) => {
              const value = getNameParts(line)[sortBy];
              return sortByLength ? Array.from(value).length : value;
            };

            names.sort((left, right) => {
              const leftValue = getValue(left);
              const rightValue = getValue(right);
              const comparison = sortByLength
                ? leftValue - rightValue
                : nameCollator.compare(leftValue, rightValue);
              if (comparison !== 0) return comparison * direction;
              if (!sortByLength && sortBy !== "full") {
                return nameCollator.compare(left.trim(), right.trim());
              }
              return 0;
            });
          }

          setEditorContent([...names, ...Array(blankLines).fill("")].join("\n"));
          showNotice(`Sorted ${names.length} ${names.length === 1 ? "name" : "names"} by ${sortLabels[sortMode]}.`);
        }

        function cleanUpDuplicates() {
          const lines = editor.value.split("\n");
          const names = lines.filter((line) => line.trim().length > 0);
          const blankLines = lines.length - names.length;
          const seen = new Set();
          const uniqueNames = names.filter((name) => {
            const key = getDuplicateKey(name);
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });
          const removed = names.length - uniqueNames.length;

          if (removed === 0) {
            showNotice("No duplicate first-and-last-name pairs found.");
            return;
          }

          setEditorContent([...uniqueNames, ...Array(blankLines).fill("")].join("\n"));
          showNotice(`Removed ${removed} duplicate ${removed === 1 ? "name" : "names"} using first and last names.`);
        }

        function getSearchMatches(query) {
          if (!query) return [];
          const expression = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "giu");
          return Array.from(editor.value.matchAll(expression), (match) => ({
            index: match.index,
            length: match[0].length
          }));
        }

        function updateFindCount() {
          const matches = getSearchMatches(searchInput.value);
          findCount.textContent = searchInput.value
            ? `${matches.length} ${matches.length === 1 ? "match" : "matches"}`
            : "Type to search";
        }

        function findNextMatch() {
          const matches = getSearchMatches(searchInput.value);
          if (matches.length === 0) {
            showNotice(searchInput.value ? "No matches found." : "Enter text to find.");
            return;
          }

          if (isReordering) setReorderMode(false);
          const nextMatch = matches.findIndex((match) => match.index >= editor.selectionEnd);
          const matchIndex = nextMatch === -1 ? 0 : nextMatch;
          const match = matches[matchIndex];
          editor.focus();
          editor.setSelectionRange(match.index, match.index + match.length);
          findCount.textContent = `Match ${matchIndex + 1} of ${matches.length}`;
        }

        function pickRandomName() {
          const names = editor.value.split("\n").filter((line) => line.trim().length > 0);
          if (names.length === 0) {
            showNotice("Add names to your list before picking one.");
            return;
          }

          const name = names[Math.floor(Math.random() * names.length)];
          showNotice(`Random pick: ${name}`);
        }

        function renderReorderList() {
          reorderList.replaceChildren();
          const names = editor.value.split("\n").filter((line) => line.trim().length > 0);
          const fragment = document.createDocumentFragment();

          names.forEach((name, index) => {
            const row = document.createElement("div");
            row.className = "reorder-row";
            row.dataset.index = String(index);
            row.draggable = true;
            row.setAttribute("role", "listitem");

            const label = document.createElement("span");
            label.className = "reorder-name";
            label.textContent = name;
            row.append(label);

            for (const [direction, labelText, symbol] of [
              [-1, "Move up", "↑"],
              [1, "Move down", "↓"]
            ]) {
              const button = document.createElement("button");
              button.type = "button";
              button.dataset.move = String(direction);
              button.setAttribute("aria-label", `${labelText}: ${name}`);
              button.textContent = symbol;
              button.disabled = direction < 0 ? index === 0 : index === names.length - 1;
              row.append(button);
            }

            fragment.append(row);
          });

          reorderList.append(fragment);
        }

        function moveName(fromIndex, toIndex) {
          const lines = editor.value.split("\n");
          const names = lines.filter((line) => line.trim().length > 0);
          const blankLines = lines.length - names.length;
          if (
            fromIndex < 0 ||
            toIndex < 0 ||
            fromIndex >= names.length ||
            toIndex >= names.length ||
            fromIndex === toIndex
          ) {
            return;
          }

          const [name] = names.splice(fromIndex, 1);
          names.splice(toIndex, 0, name);
          setEditorContent([...names, ...Array(blankLines).fill("")].join("\n"));
        }

        function setReorderMode(enabled) {
          isReordering = enabled;
          editor.hidden = enabled;
          lineNumbers.hidden = enabled;
          reorderList.hidden = !enabled;
          reorderButton.textContent = enabled ? "Done reordering" : "Reorder names";
          reorderButton.setAttribute("aria-pressed", String(enabled));
          if (enabled) {
            renderReorderList();
            reorderList.querySelector("button:not(:disabled)")?.focus();
          } else {
            editor.focus();
          }
        }

        function saveContent() {
          try {
            localStorage.setItem(contentKey, editor.value);
          } catch (error) {
            console.error("Could not save the name list.", error);
            showNotice("Your list could not be saved in this browser.");
          }
        }

        function setTheme(theme, save = true) {
          document.documentElement.dataset.theme = theme;
          themeToggle.textContent = theme === "dark" ? "Light mode" : "Dark mode";
          document.querySelector('meta[name="theme-color"]').content =
            theme === "dark" ? "#191a19" : "#f7f7f5";
          if (save) {
            try {
              localStorage.setItem(themeKey, theme);
            } catch (error) {
              console.error("Could not save the color theme.", error);
              showNotice("Your theme preference could not be saved.");
            }
          }
        }

        function downloadFile(filename, contents, type) {
          const url = URL.createObjectURL(new Blob([contents], { type }));
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          link.click();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function handleEditorChange(event) {
          if (event.isComposing) {
            updateStats();
            saveContent();
            return;
          }

          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          const value = editor.value;
          const capitalized = capitalizeWords(value);

          if (capitalized !== value) {
            editor.value = capitalized;
            editor.setSelectionRange(
              capitalizeWords(value.slice(0, start)).length,
              capitalizeWords(value.slice(0, end)).length
            );
          }

          updateStats();
          saveContent();
          recordHistory();
        }

        editor.addEventListener("input", handleEditorChange);
        editor.addEventListener("compositionend", handleEditorChange);

        editor.addEventListener("scroll", () => {
          lineNumbers.style.transform = `translateY(${-editor.scrollTop}px)`;
        });

        sortButton.addEventListener("click", () => {
          setSortMenuOpen(sortMenu.hidden);
        });

        toolsButton.addEventListener("click", () => {
          setToolsMenuOpen(toolsMenu.hidden);
        });

        sortMenu.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-sort]");
          if (!button) return;

          sortNames(button.dataset.sort);
          setSortMenuOpen(false);
          sortButton.focus();
        });

        toolsMenu.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-action]");
          if (!button) return;

          switch (button.dataset.action) {
            case "undo":
              applyHistory(historyIndex - 1);
              break;
            case "redo":
              applyHistory(historyIndex + 1);
              break;
            case "find":
              findNextMatch();
              break;
            case "pick":
              pickRandomName();
              break;
            case "stats":
              statsPanel.hidden = !statsPanel.hidden;
              statsButton.setAttribute("aria-expanded", String(!statsPanel.hidden));
              if (!statsPanel.hidden) updateNameStatistics();
              break;
            case "reorder":
              setReorderMode(!isReordering);
              break;
            default:
              break;
          }
        });

        searchInput.addEventListener("input", updateFindCount);
        searchInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            findNextMatch();
          }
        });

        document.querySelector("#cleanup-button").addEventListener("click", cleanUpDuplicates);

        reorderList.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-move]");
          if (!button) return;

          const row = button.closest(".reorder-row");
          const fromIndex = Number(row.dataset.index);
          const direction = Number(button.dataset.move);
          const toIndex = fromIndex + direction;
          moveName(fromIndex, toIndex);
          reorderList
            .querySelector(`[data-index="${toIndex}"]`)
            ?.querySelector("button:not(:disabled)")
            ?.focus();
        });

        reorderList.addEventListener("dragstart", (event) => {
          const row = event.target.closest(".reorder-row");
          if (!row) return;

          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", row.dataset.index);
        });

        reorderList.addEventListener("dragover", (event) => {
          if (event.target.closest(".reorder-row")) event.preventDefault();
        });

        reorderList.addEventListener("drop", (event) => {
          const row = event.target.closest(".reorder-row");
          if (!row) return;

          event.preventDefault();
          const fromIndex = Number(event.dataTransfer.getData("text/plain"));
          moveName(fromIndex, Number(row.dataset.index));
        });

        document.addEventListener("click", (event) => {
          if (!sortControl.contains(event.target)) {
            setSortMenuOpen(false);
          }
          if (!toolsControl.contains(event.target)) {
            setToolsMenuOpen(false);
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            if (!sortMenu.hidden) {
              setSortMenuOpen(false);
              sortButton.focus();
            }
            if (!toolsMenu.hidden) {
              setToolsMenuOpen(false);
              toolsButton.focus();
            }
            return;
          }

          if (event.target !== editor || (!event.ctrlKey && !event.metaKey)) return;
          const key = event.key.toLocaleLowerCase();
          if (key === "z") {
            event.preventDefault();
            applyHistory(historyIndex + (event.shiftKey ? 1 : -1));
          } else if (key === "y") {
            event.preventDefault();
            applyHistory(historyIndex + 1);
          }
        });

        themeToggle.addEventListener("click", () => {
          setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
        });

        document.querySelector("#download-button").addEventListener("click", () => {
          const numberedNames = editor.value
            .split("\n")
            .filter((line) => line.trim().length > 0)
            .map((name, index) => `${index + 1}. ${name}`)
            .join("\n");
          downloadFile("names.txt", numberedNames, "text/plain;charset=utf-8");
          showNotice("Your numbered list was downloaded.");
        });

        document.querySelector("#backup-button").addEventListener("click", () => {
          const backup = JSON.stringify({ version: 1, names: editor.value }, null, 2);
          downloadFile("names-backup.json", backup, "application/json");
          showNotice("Your backup was downloaded.");
        });

        document.querySelector("#restore-button").addEventListener("click", () => {
          backupFile.click();
        });

        backupFile.addEventListener("change", async () => {
          const [file] = backupFile.files;
          if (!file) return;

          try {
            const backup = JSON.parse(await file.text());
            if (backup.version !== 1 || typeof backup.names !== "string") {
              throw new Error("Unsupported backup format.");
            }
            setEditorContent(capitalizeWords(backup.names));
            showNotice("Your backup was restored.");
          } catch (error) {
            console.error("Could not restore the name list.", error);
            showNotice("That backup file is invalid or could not be read.");
          } finally {
            backupFile.value = "";
          }
        });

        try {
          editor.value = localStorage.getItem(contentKey) || "";
          const savedTheme = localStorage.getItem(themeKey);
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          setTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme, false);
        } catch (error) {
          console.error("Could not load saved Namepad settings.", error);
          showNotice("Saved settings could not be loaded in this browser.");
        }

        history = [editor.value];
        historyIndex = 0;
        updateHistoryButtons();
        updateStats();
        editor.focus();
        editor.setSelectionRange(editor.value.length, editor.value.length);
      })();
    </script>
  </body>
</html>
